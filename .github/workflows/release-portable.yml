name: Portable Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package after CI is green
        required: true
        default: main
      release_tag:
        description: Optional v* tag to create or update with portable assets
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: portable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve portable release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    outputs:
      checkout-ref: ${{ steps.version.outputs.checkout-ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          checkout_ref="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "workflow_run" && "$checkout_ref" != "$WORKFLOW_HEAD_SHA" ]]; then
            echo "Checked out commit does not match the successful CI workflow commit." >&2
            exit 1
          fi

          tag=""
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            if [[ ! "$INPUT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release_tag must use the vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse --verify "refs/tags/${INPUT_RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$checkout_ref" ]]; then
              echo "release_tag $INPUT_RELEASE_TAG does not point at the checked out commit." >&2
              exit 1
            fi
            tag="$INPUT_RELEASE_TAG"
          else
            mapfile -t matching_tags < <(git tag --points-at "$checkout_ref" --list "v*")
            if [[ "${#matching_tags[@]}" -gt 1 ]]; then
              echo "Multiple release tags point at the checked out commit." >&2
              exit 1
            fi
            if [[ "${#matching_tags[@]}" -eq 1 ]]; then
              tag="${matching_tags[0]}"
            fi
          fi

          python scripts/check-release-contracts.py
          if [[ -n "$tag" ]]; then
            RELEASE_TAG="$tag"
            python scripts/check-release-contracts.py --release-tag "$RELEASE_TAG"
            version="${tag#v}"
          else
            short="$(git rev-parse --short "$checkout_ref")"
            version="dev-${short}"
          fi

          {
            echo "checkout-ref=$checkout_ref"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Verify exact release commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: resolve-release
    steps:
      - name: Verify CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ needs.resolve-release.outputs.checkout-ref }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_CONCLUSION" == "success" && "$WORKFLOW_RUN_HEAD_SHA" == "$CHECKOUT_REF" ]]; then
              exit 0
            fi
            echo "No successful CI run exists for release commit $CHECKOUT_REF." >&2
            exit 1
          fi

          runs_file="$RUNNER_TEMP/ci-runs.json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$CHECKOUT_REF" \
            -f status=completed \
            -f per_page=100 > "$runs_file"
          python - "$runs_file" "$CHECKOUT_REF" <<'PY'
          import json
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          target = sys.argv[2]
          passed = any(
              run.get("head_sha") == target and run.get("conclusion") == "success"
              for run in payload.get("workflow_runs", [])
          )
          if not passed:
              print(
                  f"No successful CI run exists for release commit {target}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [resolve-release, verify-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Build Windows portable package
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1 -OutputDir dist -Version "${{ needs.resolve-release.outputs.version }}"

      - name: Set up package verifier
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.10"

      - name: Verify final archive and isolated server
        run: python scripts/check-package-smoke.py --directory "dist" --kind portable --arch "x64" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ilab-gpt-conjure-windows-portable-x64
          path: |
            dist/*.zip
            dist/*.sha256.txt
            dist/portable-build.json
          if-no-files-found: error

  windows-app-x64:
    name: Windows standard app ZIP
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [resolve-release, verify-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Build Windows standard app package
        shell: pwsh
        run: ./packaging/windows/build-app.ps1 -OutputDir dist -Version "${{ needs.resolve-release.outputs.version }}"

      - name: Set up package verifier
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.10"

      - name: Verify final archive and isolated server
        run: python scripts/check-package-smoke.py --directory "dist" --kind standard --arch "x64" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Upload Windows standard app artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ilab-gpt-conjure-windows-app-x64
          path: |
            dist/*.zip
            dist/*.sha256.txt
            dist/windows-app-build.json
          if-no-files-found: error

  macos-portable:
    name: macOS ${{ matrix.arch }} portable package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    needs: [resolve-release, verify-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: ilab-gpt-conjure-macos-portable-arm64
          - arch: x64
            runner: macos-15-intel
            artifact: ilab-gpt-conjure-macos-portable-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Build macOS portable package
        shell: bash
        run: ./packaging/macos/build-portable.sh --output-dir "dist/${{ matrix.arch }}" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Verify macOS package architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${{ matrix.arch }}/macos-portable-build.json"
          grep -q '"architecture": "${{ matrix.arch }}"' "dist/${{ matrix.arch }}/macos-portable-build.json"
          ls "dist/${{ matrix.arch }}"/ilab-gpt-conjure_macos_portable_${{ matrix.arch }}_*.zip

      - name: Set up package verifier
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.10"

      - name: Verify final archive and isolated server
        run: python scripts/check-package-smoke.py --directory "dist/${{ matrix.arch }}" --kind portable --arch "${{ matrix.arch }}" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Upload macOS portable artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.arch }}/*.zip
            dist/${{ matrix.arch }}/*.sha256.txt
            dist/${{ matrix.arch }}/macos-portable-build.json
          if-no-files-found: error

  macos-dmg:
    name: macOS ${{ matrix.arch }} standard DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    needs: [resolve-release, verify-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: ilab-gpt-conjure-macos-dmg-arm64
          - arch: x64
            runner: macos-15-intel
            artifact: ilab-gpt-conjure-macos-dmg-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Build macOS standard app DMG
        shell: bash
        run: ./packaging/macos/build-app.sh --output-dir "dist/${{ matrix.arch }}" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Verify macOS DMG architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${{ matrix.arch }}/macos-app-build.json"
          grep -q '"architecture": "${{ matrix.arch }}"' "dist/${{ matrix.arch }}/macos-app-build.json"
          ls "dist/${{ matrix.arch }}"/iLab-GPT-CONJURE-macos-${{ matrix.arch }}-*.dmg

      - name: Set up package verifier
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.10"

      - name: Verify final archive and isolated server
        run: python scripts/check-package-smoke.py --directory "dist/${{ matrix.arch }}" --kind standard --arch "${{ matrix.arch }}" --version "${{ needs.resolve-release.outputs.version }}"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.arch }}/*.dmg
            dist/${{ matrix.arch }}/*.sha256.txt
            dist/${{ matrix.arch }}/macos-app-build.json
          if-no-files-found: error

  github-release-assets:
    name: Upload GitHub release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    needs:
      - resolve-release
      - windows-portable
      - windows-app-x64
      - macos-portable
      - macos-dmg
    if: ${{ needs.resolve-release.outputs.tag != '' }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
          fetch-depth: 1

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-assets

      - name: Set up release tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.10"

      - name: Verify artifacts and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.checkout-ref }}
          ILAB_CONJURE_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.ILAB_CONJURE_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: >-
          python scripts/publish-release.py --assets-dir dist-assets
          --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
