name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ILAB_SKIP_PURE_FRONTEND_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install WebUI dependencies
        run: python -m pip install --require-hashes -r requirements-webui.txt

      - name: Install coverage tool
        if: matrix.python-version == '3.13'
        run: python -m pip install coverage==7.15.2

      - name: Install frontend test dependencies
        run: npm ci

      - name: Run Python tests
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.13" ]]; then
            coverage run --source=codex_image -m unittest discover -s tests -v
            coverage report --fail-under=80
          else
            python -m unittest discover -s tests -v
          fi

  windows-python-lock:
    name: Windows Python runtime lock
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-webui.txt

  python-quality-security:
    name: Python quality and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime and audit tools
        run: |
          python -m pip install --require-hashes -r requirements-webui.txt
          python -m pip install ruff==0.16.0 bandit==1.9.4 pip-audit==2.10.1

      - name: Check release metadata and dependency lock
        run: python scripts/check-release-contracts.py

      - name: Check critical Python errors
        run: ruff check codex_image tests scripts packaging

      - name: Scan Python code for high-confidence high-severity issues
        run: bandit -q -r codex_image scripts packaging -x '*/tests/*' -lll -iii

      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements-webui.txt

  webui-build:
    name: WebUI typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for the frontend test runner
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run pure frontend behavior tests
        run: python -m tests.frontend_runner

      - name: Check WebUI frontend
        run: npm run check:webui

      - name: Ensure generated frontend assets are committed
        run: git diff --exit-code -- codex_image/webui/static

  rust-launcher:
    name: Rust launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Check Rust formatting
        working-directory: launcher
        run: cargo fmt --all -- --check

      - name: Lint Rust launcher
        working-directory: launcher
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust launcher
        working-directory: launcher
        run: cargo test --all-targets --locked

  public-export-guard:
    name: Public export guard
    if: github.repository == 'kadevin/ilab-conjure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public mirror boundaries
        run: |
          test ! -e AGENT.md
          test ! -e AGENTS.md
          test -f DESIGN.md
          test ! -d docs/superpowers
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          forbidden_literals = ["/Users" + "/ilab"]
          secret_pattern = re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b")
          ignored_dirs = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          problems = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for literal in forbidden_literals:
                  if literal in text:
                      problems.append(f"{path}: contains {literal}")
              if secret_pattern.search(text):
                  problems.append(f"{path}: contains a long sk-* shaped token")

          if problems:
              print("\n".join(problems), file=sys.stderr)
              raise SystemExit(1)
          PY
