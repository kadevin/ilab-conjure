[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ilab-conjure"
dynamic = ["version"]
description = "Local-first image generation workbench with WebUI and CLI."
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "certifi==2026.10.23",
  "Pillow==13.0.0",
]

[project.scripts]
codex-image = "codex_image.cli:main_entry"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "codex_image.version.APP_VERSION" }

[tool.setuptools.packages.find]
include = ["codex_image*"]
namespaces = false

[tool.setuptools.package-data]
"codex_image.webui" = ["static/*", "static/**/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
